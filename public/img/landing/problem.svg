<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" text-rendering="optimizeLegibility" shape-rendering="geometricPrecision">
    <defs>
        <!-- Filtros de sombra para simular profundidad Z (2.5D) -->
        <filter id="shadow-back" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A202C" flood-opacity="0.06"/>
        </filter>
        <filter id="shadow-mid" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A202C" flood-opacity="0.10"/>
        </filter>
        <filter id="shadow-front" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1A202C" flood-opacity="0.14"/>
        </filter>
        
        <!-- Filtros de desenfoque para profundidad de campo (Signos de interrogación) -->
        <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8"/>
        </filter>
        <filter id="blur-light" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>

        <!-- Símbolo: Estrella de Calificación -->
        <g id="star-grp">
            <path d="M12 2l2.4 7.4h7.6l-6.1 4.5 2.4 7.4-6.3-4.6-6.3 4.6 2.4-7.4-6.1-4.5h7.6z" fill="#F6AD55" transform="scale(0.85) translate(-1, -1)"/>
        </g>

        <!-- Símbolo: 5 Estrellas -->
        <g id="five-stars">
            <use href="#star-grp" x="0" y="0"/>
            <use href="#star-grp" x="18" y="0"/>
            <use href="#star-grp" x="36" y="0"/>
            <use href="#star-grp" x="54" y="0"/>
            <use href="#star-grp" x="72" y="0"/>
        </g>
    </defs>

    <style>
        /* Tipografía UI Limpia */
        text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 
           Sistema de Caos Controlado (Movimiento Browniano) 
           Tiempos de duración primos para evitar sincronización y crear un loop infinito impredecible.
        */
        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-22px, 18px) rotate(-4deg) scale(0.98); }
            66% { transform: translate(14px, -20px) rotate(5deg) scale(1.03); }
        }
        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(25px, -15px) rotate(3deg) scale(1.02); }
            66% { transform: translate(-18px, 22px) rotate(-5deg) scale(0.97); }
        }
        @keyframes float-3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-15px, -25px) rotate(-6deg) scale(0.96); }
            66% { transform: translate(24px, 15px) rotate(4deg) scale(1.04); }
        }
        @keyframes float-4 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(28px, 18px) rotate(5deg) scale(1.03); }
            66% { transform: translate(-20px, -24px) rotate(-4deg) scale(0.98); }
        }
        @keyframes float-5 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-24px, 25px) rotate(-3deg) scale(1.01); }
            66% { transform: translate(22px, -20px) rotate(6deg) scale(0.99); }
        }
        @keyframes float-6 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(20px, -28px) rotate(4deg) scale(0.98); }
            66% { transform: translate(-26px, 18px) rotate(-5deg) scale(1.02); }
        }

        /* Animaciones orbitales y pulsantes para los Signos de Interrogación */
        @keyframes q-float-1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.9; }
            50% { transform: translate(-35px, -25px) rotate(-18deg) scale(1.1); opacity: 1; }
        }
        @keyframes q-float-2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.8; }
            50% { transform: translate(30px, -40px) rotate(20deg) scale(1.15); opacity: 1; }
        }
        @keyframes q-float-3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.4; }
            50% { transform: translate(-20px, 40px) rotate(-15deg) scale(0.9); opacity: 0.7; }
        }
        @keyframes q-float-4 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: translate(45px, 20px) rotate(25deg) scale(0.85); opacity: 0.8; }
        }
        @keyframes q-float-5 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.2; }
            50% { transform: translate(-15px, -30px) rotate(-10deg) scale(1.1); opacity: 0.4; }
        }
        @keyframes q-float-6 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.9; }
            50% { transform: translate(10px, 35px) rotate(15deg) scale(0.95); opacity: 0.6; }
        }
        
        .anim-c1 { animation: float-1 13s ease-in-out infinite; }
        .anim-c2 { animation: float-2 17s ease-in-out infinite; }
        .anim-c3 { animation: float-3 19s ease-in-out infinite; }
        .anim-c4 { animation: float-4 23s ease-in-out infinite; }
        .anim-c5 { animation: float-5 29s ease-in-out infinite; }
        .anim-c6 { animation: float-6 31s ease-in-out infinite; }

        .anim-q1 { animation: q-float-1 37s ease-in-out infinite; }
        .anim-q2 { animation: q-float-2 41s ease-in-out infinite; }
        .anim-q3 { animation: q-float-3 43s ease-in-out infinite; }
        .anim-q4 { animation: q-float-4 47s ease-in-out infinite; }
        .anim-q5 { animation: q-float-5 53s ease-in-out infinite; }
        .anim-q6 { animation: q-float-6 59s ease-in-out infinite; }
    </style>

    <!-- CAPA 1: Signos de interrogación de fondo (Desenfocados, pequeños) -->
    <!-- Far Left -->
    <g transform="translate(180, 420)">
        <g class="anim-q5">
            <g transform="rotate(12)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="55" font-weight="900" filter="url(#blur-heavy)">?</text>
            </g>
        </g>
    </g>
    <!-- Top Center Background -->
    <g transform="translate(520, 140)">
        <g class="anim-q5" style="animation-delay: -10s;">
            <g transform="rotate(-18)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="70" font-weight="900" filter="url(#blur-heavy)">?</text>
            </g>
        </g>
    </g>
    <!-- Mid Left Background -->
    <g transform="translate(250, 240)">
        <g class="anim-q3">
            <g transform="rotate(-15)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="85" font-weight="900" filter="url(#blur-light)">?</text>
            </g>
        </g>
    </g>
    <!-- Bottom Right Background -->
    <g transform="translate(850, 680)">
        <g class="anim-q4">
            <g transform="rotate(22)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="100" font-weight="900" filter="url(#blur-light)">?</text>
            </g>
        </g>
    </g>

    <!-- CAPA 2: Tarjetas de Fondo -->
    <!-- Tarjeta 1: Data Science -->
    <g transform="translate(320, 250)">
        <g class="anim-c1">
            <g transform="rotate(-12) scale(0.85)">
                <g transform="translate(-120, -80)">
                    <rect width="240" height="160" rx="16" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1.5" filter="url(#shadow-back)"/>
                    <rect x="20" y="20" width="115" height="26" rx="13" fill="#ED8936" opacity="0.12"/>
                    <text x="77.5" y="37.5" fill="#ED8936" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">DATA SCIENCE</text>
                    <text x="20" y="75" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Machine Learning</text>
                    <text x="20" y="100" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Avanzado</text>
                    <text x="20" y="137" fill="#718096" font-size="15" font-weight="800">4.8</text>
                    <use href="#five-stars" x="52" y="123"/>
                </g>
            </g>
        </g>
    </g>

    <!-- Tarjeta 2: AWS Cloud -->
    <g transform="translate(680, 260)">
        <g class="anim-c2">
            <g transform="rotate(14) scale(0.88)">
                <g transform="translate(-120, -80)">
                    <rect width="240" height="160" rx="16" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1.5" filter="url(#shadow-back)"/>
                    <rect x="20" y="20" width="100" height="26" rx="13" fill="#3182CE" opacity="0.12"/>
                    <text x="70" y="37.5" fill="#3182CE" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">AWS CLOUD</text>
                    <text x="20" y="75" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Cloud Architect</text>
                    <text x="20" y="100" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Certificación</text>
                    <text x="20" y="137" fill="#718096" font-size="15" font-weight="800">4.7</text>
                    <use href="#five-stars" x="52" y="123"/>
                </g>
            </g>
        </g>
    </g>

    <!-- CAPA 3: Tarjetas de Medio Plano -->
    <!-- Tarjeta 3: Java -->
    <g transform="translate(300, 480)">
        <g class="anim-c3">
            <g transform="rotate(6) scale(0.93)">
                <g transform="translate(-120, -80)">
                    <rect width="240" height="160" rx="16" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1.5" filter="url(#shadow-mid)"/>
                    <rect x="20" y="20" width="115" height="26" rx="13" fill="#E53E3E" opacity="0.12"/>
                    <text x="77.5" y="37.5" fill="#E53E3E" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">JAVA BACKEND</text>
                    <text x="20" y="75" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Microservicios</text>
                    <text x="20" y="100" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Empresariales</text>
                    <text x="20" y="137" fill="#718096" font-size="15" font-weight="800">4.5</text>
                    <use href="#five-stars" x="52" y="123"/>
                </g>
            </g>
        </g>
    </g>

    <!-- Tarjeta 4: Platzi -->
    <g transform="translate(710, 490)">
        <g class="anim-c4">
            <g transform="rotate(-8) scale(0.95)">
                <g transform="translate(-120, -80)">
                    <rect width="240" height="160" rx="16" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1.5" filter="url(#shadow-mid)"/>
                    <rect x="20" y="20" width="75" height="26" rx="13" fill="#38A169" opacity="0.12"/>
                    <text x="57.5" y="37.5" fill="#38A169" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">PLATZI</text>
                    <text x="20" y="75" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Desarrollo Web</text>
                    <text x="20" y="100" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Frontend React</text>
                    <text x="20" y="137" fill="#718096" font-size="15" font-weight="800">4.9</text>
                    <use href="#five-stars" x="52" y="123"/>
                </g>
            </g>
        </g>
    </g>

    <!-- CAPA 4: Tarjetas de Primer Plano -->
    <!-- Tarjeta 5: Coursera -->
    <g transform="translate(490, 320)">
        <g class="anim-c5">
            <g transform="rotate(-4) scale(1)">
                <g transform="translate(-120, -80)">
                    <rect width="240" height="160" rx="16" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1.5" filter="url(#shadow-front)"/>
                    <rect x="20" y="20" width="95" height="26" rx="13" fill="#3182CE" opacity="0.12"/>
                    <text x="67.5" y="37.5" fill="#3182CE" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">COURSERA</text>
                    <text x="20" y="75" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">UX/UI Design</text>
                    <text x="20" y="100" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Professional</text>
                    <text x="20" y="137" fill="#718096" font-size="15" font-weight="800">4.8</text>
                    <use href="#five-stars" x="52" y="123"/>
                </g>
            </g>
        </g>
    </g>

    <!-- Tarjeta 6: Udemy (El foco principal) -->
    <g transform="translate(520, 520)">
        <g class="anim-c6">
            <g transform="rotate(3) scale(1.05)">
                <g transform="translate(-120, -80)">
                    <rect width="240" height="160" rx="16" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1.5" filter="url(#shadow-front)"/>
                    <rect x="20" y="20" width="75" height="26" rx="13" fill="#38A169" opacity="0.12"/>
                    <text x="57.5" y="37.5" fill="#38A169" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">UDEMY</text>
                    <text x="20" y="75" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Python Completo</text>
                    <text x="20" y="100" fill="#2D3748" font-size="19" font-weight="900" letter-spacing="-0.5">Desde Cero</text>
                    <text x="20" y="137" fill="#718096" font-size="15" font-weight="800">4.6</text>
                    <use href="#five-stars" x="52" y="123"/>
                </g>
            </g>
        </g>
    </g>

    <!-- CAPA 5: Signos de Interrogación de Primer Plano (Nítidos, Grandes) -->
    <!-- Top Right Large -->
    <g transform="translate(820, 160)">
        <g class="anim-q1">
            <g transform="rotate(15)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="150" font-weight="900" filter="url(#shadow-mid)">?</text>
            </g>
        </g>
    </g>
    <!-- Bottom Left Large -->
    <g transform="translate(160, 620)">
        <g class="anim-q2">
            <g transform="rotate(-22)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="170" font-weight="900" filter="url(#shadow-front)">?</text>
            </g>
        </g>
    </g>
    <!-- Mid Right Edge -->
    <g transform="translate(940, 440)">
        <g class="anim-q6">
            <g transform="rotate(-8)">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#4C1D95" font-size="95" font-weight="900" filter="url(#shadow-back)">?</text>
            </g>
        </g>
    </g>
</svg>